<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chakravyuh — Synthetic Geospatial Fraud & ATM Hit Heatmap</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Heat Plugin -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent-cyan: #06b6d4;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-bar {
      display: flex;
      gap: 16px;
    }

    .stat-pill {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 4px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .stat-pill .label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .stat-pill .val {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-pill .val.highlight-rose { color: var(--accent-rose); }
    .stat-pill .val.highlight-cyan { color: var(--accent-cyan); }

    /* Layout */
    .main-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #090d16;
    }

    /* Floating Control Panel */
    .controls-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      width: 320px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    .panel-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .layer-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .layer-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .layer-btn.active {
      background: rgba(6, 182, 212, 0.2);
      border-color: var(--accent-cyan);
      color: #38bdf8;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
    }

    .layer-btn.active.rose {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--accent-rose);
      color: #fb7185;
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.3);
    }

    .slider-container {
      margin-top: 12px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent-cyan);
    }

    /* Legend */
    .legend {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 18px;
      backdrop-filter: blur(12px);
      font-size: 12px;
      color: var(--text-muted);
    }

    .gradient-bar {
      height: 10px;
      width: 180px;
      border-radius: 5px;
      margin: 8px 0;
      background: linear-gradient(to right, blue, cyan, lime, yellow, red);
    }

    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Custom Map Marker Popup */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }
    .leaflet-popup-tip {
      background: rgba(15, 23, 42, 0.95);
    }
  </style>
</head>

    <div class="logo-badge">
      <span style="font-size: 20px;">🌐</span>
      <h1>Chakravyuh — Synthetic Geospatial Intelligence</h1>
    </div>
    <div class="stats-bar">
      <div class="stat-pill">
        <span class="label">Total Hit Points</span>
        <span class="val highlight-cyan">2,500</span>
      </div>
      <div class="stat-pill">
        <span class="label">Fraud / Mule Hits</span>

        <span class="label">ATM Terminals</span>

      <div class="stat-pill">

  <div class="main-container">
    <div id="map"></div>

        <button class="layer-btn" id="btn-atm" onclick="switchLayer('atm')">
          <span>🏧 ATM Cashout Clusters</span>
          <span style="font-size: 11px; opacity: 0.8;">496</span>
        </button>
      </div>

      <div class="slider-container">
        <div class="slider-label">
          <span>Heat Blur Radius</span>
          <span id="radius-val">22px</span>
        </div>
        <input type="range" min="10" max="45" value="22" id="radius-slider" oninput="updateRadius(this.value)">
      </div>

      <div class="slider-container" style="margin-top: 10px;">
        <div class="slider-label">
          <span>Intensity Multiplier</span>
          <span id="intensity-val">1.0x</span>
        </div>
        <input type="range" min="0.4" max="2.5" step="0.1" value="1.0" id="intensity-slider" oninput="updateIntensity(this.value)">
      </div>
    </div>

    <div class="legend">
      <div>Geospatial Hit Density</div>
      <div class="gradient-bar"></div>
      <div class="legend-labels">
        <span>Low (Retail)</span>
        <span>Medium</span>
        <span>High (Ring / ATM Burst)</span>
      </div>
    </div>
  </div>

    // Initialize Leaflet Map centered on India
    const map = L.map('map', {
      center: [22.3511, 78.6677],
      zoom: 5,
      minZoom: 4,
      maxZoom: 15,
      zoomControl: false
    });

    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    // Dark Tile Layer (CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Heat Layer Options
    let currentRadius = 22;
    let currentIntensity = 1.0;
    let activeDataset = dataAll;

    let heatLayer = L.heatLayer(dataAll, {
      radius: currentRadius,
      blur: 18,
      maxZoom: 12,
      max: 1.0,
      gradient: {
        0.1: '#3b82f6',
        0.3: '#06b6d4',
        0.5: '#10b981',
        0.7: '#f59e0b',
        0.9: '#ef4444',
        1.0: '#ff0055'
      }
    }).addTo(map);

    // Hotspot Cluster Layer Group
    const markerGroup = L.layerGroup().addTo(map);

    function renderHotspotMarkers() {
      markerGroup.clearLayers();
      hotspotMarkersData.forEach(h => {
        const marker = L.circleMarker([h.lat, h.lng], {
          radius: Math.min(14, Math.max(5, h.hit_count / 3)),
          fillColor: h.fraud_hit_count > 0 ? '#f43f5e' : '#06b6d4',
          color: '#ffffff',
          weight: 1.2,
          opacity: 0.9,
          fillOpacity: 0.6
        });

        marker.bindPopup(`
          <div style="font-size: 13px; line-height: 1.5;">
            <strong style="color: #38bdf8;">${h.city} Hotspot</strong><br/>
            <span>Dominant: <b>${h.dominant_type}</b></span><br/>
            <span>Hits: <b>${h.hit_count}</b> (Fraud: <b style="color: #f43f5e">${h.fraud_hit_count}</b>)</span><br/>
            <span>Volume: <b>${h.total_amount_inr}</b></span><br/>
            <span>Avg Risk: <b>${(h.avg_risk * 100).toFixed(1)}%</b></span>
          </div>
        `);
        markerGroup.addLayer(marker);
      });
    }

    renderHotspotMarkers();

    // Layer Switcher
    function switchLayer(layerType) {
      document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
      
      if (layerType === 'all') {
        activeDataset = dataAll;
        document.getElementById('btn-all').classList.add('active');
      } else if (layerType === 'fraud') {
        activeDataset = dataFraud;
        document.getElementById('btn-fraud').classList.add('active');
      } else if (layerType === 'atm') {
        activeDataset = dataAtm;
        document.getElementById('btn-atm').classList.add('active');
      }

      applyHeatLayer();
    }

    function applyHeatLayer() {
      if (heatLayer) {
        map.removeLayer(heatLayer);
      }

      // Apply intensity scaling
      const scaledData = activeDataset.map(p => [p[0], p[1], Math.min(1.0, p[2] * currentIntensity)]);

      heatLayer = L.heatLayer(scaledData, {
        radius: currentRadius,
        blur: Math.max(10, Math.floor(currentRadius * 0.8)),
        maxZoom: 12,
        max: 1.0,
        gradient: {
          0.1: '#3b82f6',
          0.3: '#06b6d4',
          0.5: '#10b981',
          0.7: '#f59e0b',
          0.9: '#ef4444',
          1.0: '#ff0055'
        }
      }).addTo(map);
    }

    function updateRadius(val) {
      currentRadius = parseInt(val, 10);
      document.getElementById('radius-val').innerText = currentRadius + 'px';
      applyHeatLayer();
    }

    function updateIntensity(val) {
      currentIntensity = parseFloat(val);
      document.getElementById('intensity-val').innerText = currentIntensity.toFixed(1) + 'x';
      applyHeatLayer();
    }
